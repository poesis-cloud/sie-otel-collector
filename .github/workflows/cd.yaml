# NOTE: This workflow is dormant until `sie/sie-otel-collector/` is split out
# into its own GitHub repo `poesis-cloud/sie-otel-collector` (follow-up Story
# per Governor decision 2026-05-25, S-002 HUDDLE issue 1, option b).
# Required secrets (to provision when the repo is split out):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME

name: sie-otel-collector-cd

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - aks
          - onprem
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - preprod
          - prod

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prod-deploy:
    if: ${{ github.event.inputs.target == 'aks' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
      - name: Deploy with Makefile
        run: |
          make prod-deploy \
            DEPLOY_ENV=${{ github.event.inputs.environment }}

  deploy-onprem:
    if: ${{ github.event.inputs.target == 'onprem' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package helm chart
        run: make package-helm
      - name: Upload helm package
        uses: actions/upload-artifact@v4
        with:
          name: sie-otel-collector-helm-package
          path: "*.tgz"
