# Prod environment values for sie-otel-collector
# Governor decision (S-002, issue 3, option i): prod = 2 replicas (HA per ADR-001 D-1).
# Out of scope for this Story (S-002): real prod tuning beyond chart scaffolding.

nameOverride: ""
fullnameOverride: ""

image:
  repository: otel/opentelemetry-collector-contrib
  # TODO(Ivy/Governor before merge): verify exact latest stable tag against
  # https://github.com/open-telemetry/opentelemetry-collector-releases/releases
  # Pinned at HUDDLE time (May 2026) to a known-good stable.
  tag: "0.115.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 2

service:
  name: sie-otel-collector
  type: ClusterIP
  port: 4317
  annotations: {}

config: |
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
  exporters:
    debug:
      verbosity: detailed
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        exporters: [debug]
      logs:
        receivers: [otlp]
        exporters: [debug]
    telemetry:
      logs:
        level: info

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
# topologySpreadConstraints: deferred to a future HA-tuning Story.
